<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renommator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="upload-page">
        <div class="upload-card">
            <div class="upload-header">
                <div class="brand-mark">R</div>
                <div>
                    <h1>Renomminator</h1>
                    <p class="upload-description">Envoyez votre archive ZIP et laissez Renomminator organiser vos fichiers proprement.</p>
                </div>
            </div>

            <form class="upload-form" method="post" action="/" enctype="multipart/form-data">
                <label class="file-input-wrapper" for="file-input">
                    <input type="file" name="file" id="file-input" accept=".zip" required>
                    <span>Choisir un fichier ZIP</span>
                </label>
                <button class="upload-button" type="submit">Envoyer maintenant</button>
            </form>

            <div class="upload-note">
                <p>Format accepté : <strong>.zip</strong></p>
                <p>Votre archive sera renommée et préparée pour un traitement propre.</p>
            </div>
        </div>
    </div>
</body>
</html>
